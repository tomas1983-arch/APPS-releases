<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הורדת AgroTom</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
    color: #222;
  }
  h1 { margin-bottom: 8px; }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 28px;
    background: #2E7D32;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
  }
  #fallback { display: none; }
</style>
</head>
<body>
  <h1>AgroTom</h1>
  <p id="status">מעביר אותך להורדה...</p>

  <div id="fallback">
    <a class="btn" id="downloadLink" href="#">הורדת האפליקציה</a>
  </div>

  <script>
    // דף הפניה קבוע. אין צורך לשנות משהו כאן לעולם - הוא תמיד קורא
    // את היעד העדכני משדה apkUrl ב-version.json, וגם ההפניה
    // האוטומטית וגם הכפתור משתמשים באותו ערך שנקרא עכשיו -
    // אין שום קישור קשיח בקובץ הזה.
    var MANIFEST_URL = "https://raw.githubusercontent.com/tomas1983-arch/APPS-releases/main/agrotom/version.json";

    fetch(MANIFEST_URL + "?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("downloadLink").href = data.apkUrl;
        window.location.href = data.apkUrl;
      })
      .catch(function () {
        document.getElementById("status").textContent = "תקלה בטעינה, רענן את הדף.";
      });

    // אם ההפניה האוטומטית לא קרתה מסיבה כלשהי (חסימת JS, רשת איטית) -
    // מציגים את הכפתור הידני אחרי רגע, עם אותו קישור שכבר נקרא.
    setTimeout(function () {
      document.getElementById("fallback").style.display = "block";
    }, 1500);
  </script>
</body>
</html>
